<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ValesPlus · Gestión</title>
<style>
:root{--bg:#0a0b0f;--card:#161922;--gold:#FFC400;--mint:#00E5A8;--ink:#F7F5F0;--muted:#9A968C;--line:rgba(255,196,0,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:1.25rem}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:.35rem}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.3rem}
input,textarea{width:100%;background:#0e1016;border:1px solid var(--line);border-radius:10px;padding:.7rem;color:var(--ink);margin-bottom:.65rem;font-size:16px}
button{width:100%;padding:.8rem;border:none;border-radius:12px;font-weight:700;cursor:pointer;background:linear-gradient(120deg,#FFC400,#FF9100);color:#111;margin-top:.35rem}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stat{background:#0e1016;border-radius:12px;padding:.85rem;text-align:center;border:1px solid var(--line)}
.stat strong{display:block;font-size:1.5rem;color:var(--gold)}
.stat span{font-size:.75rem;color:var(--muted)}
.msg{font-size:.85rem;color:var(--mint);min-height:1.2em;margin-top:.5rem}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ValesPlus · Gestión</h1>
  <p class="sub">Panel privado. No enlazado desde la app pública.</p>
  <div class="card" id="loginBox">
    <label>Clave de administración</label>
    <input id="key" type="password" placeholder="Clave" autocomplete="current-password">
    <button type="button" id="btnLogin">Entrar</button>
    <p class="msg" id="loginMsg"></p>
  </div>
  <div id="panel" class="hidden">
    <div class="card">
      <div class="stats">
        <div class="stat"><strong id="sDevices">—</strong><span>Instalaciones / dispositivos</span></div>
        <div class="stat"><strong id="sOnline">—</strong><span>Activos (~15 min)</span></div>
      </div>
      <button type="button" class="btn-ghost" id="btnRefresh" style="margin-top:.75rem">Actualizar contadores</button>
    </div>
    <div class="card">
      <label>Título del anuncio</label>
      <input id="aTitle" placeholder="Nueva función disponible">
      <label>Mensaje</label>
      <textarea id="aBody" rows="3" placeholder="Texto que verán al abrir la app"></textarea>
      <button type="button" id="btnAnnounce">Enviar a todos</button>
      <p class="msg" id="aMsg"></p>
    </div>
    <div class="card">
      <label>Funcionalidades en caliente (JSON)</label>
      <textarea id="featJson" rows="5" placeholder='{"banner_text":"Prueba el nuevo campo precio","paid_premium":false}'></textarea>
      <button type="button" id="btnFeat">Publicar features</button>
      <p class="msg" id="fMsg"></p>
      <p class="sub" style="margin-top:.5rem">Los clientes consultan /api/valesplus/features cada 2 min. Puedes activar flags de pago sin redesplegar la app base.</p>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='vp_admin_key';
  function key(){ return localStorage.getItem(KEY)||document.getElementById('key').value.trim(); }
  document.getElementById('btnLogin').onclick=function(){
    var k=document.getElementById('key').value.trim();
    if(!k){ loginMsg.textContent='Escribe la clave'; return; }
    localStorage.setItem(KEY,k);
    loginBox.classList.add('hidden'); panel.classList.remove('hidden');
    refresh();
  };
  if(localStorage.getItem(KEY)){ loginBox.classList.add('hidden'); panel.classList.remove('hidden'); }
  async function refresh(){
    try{
      var r=await fetch('/api/valesplus/stats');
      var d=await r.json();
      if(d&&d.ok){ sDevices.textContent=d.devices||0; sOnline.textContent=d.online||0;
        if(d.features) featJson.value=JSON.stringify(d.features,null,2);
      }
    }catch(e){ console.warn(e); }
  }
  btnRefresh.onclick=refresh;
  if(!loginBox.classList.contains('hidden')===false) refresh();
  else if(localStorage.getItem(KEY)) refresh();
  btnAnnounce.onclick=async function(){
    aMsg.textContent='Enviando…';
    try{
      var r=await fetch('/api/valesplus/announcements',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-ValesPlus-Admin':key()},
        body:JSON.stringify({title:aTitle.value.trim(), body:aBody.value.trim()})
      });
      var d=await r.json();
      aMsg.textContent=d.ok?'Anuncio publicado':'Error: '+(d.error||r.status);
      if(d.ok){ aTitle.value=''; aBody.value=''; }
    }catch(e){ aMsg.textContent='Error de red'; }
  };
  btnFeat.onclick=async function(){
    fMsg.textContent='Publicando…';
    try{
      var obj=JSON.parse(featJson.value||'{}');
      var r=await fetch('/api/valesplus/features',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-ValesPlus-Admin':key()},
        body:JSON.stringify(obj)
      });
      var d=await r.json();
      fMsg.textContent=d.ok?'Features actualizadas':'Error: '+(d.error||r.status);
    }catch(e){ fMsg.textContent='JSON inválido o error de red'; }
  };
})();
</script>
</body>
</html>
