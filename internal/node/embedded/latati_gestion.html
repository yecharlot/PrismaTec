<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>La Tati · Gestión</title>
<style>
:root{--bg:#0e0a12;--card:#1a1220;--line:#3a2a44;--ink:#f4eef8;--muted:#a894b4;--gold:#ffc85a;--mint:#5dffc2;--pink:#ff6eb4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:70px}
.top{position:sticky;top:0;z-index:10;background:rgba(14,10,18,.95);border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin-bottom:.7rem}
.btn{width:100%;border:none;border-radius:12px;padding:.7rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
.btn-gold{background:linear-gradient(120deg,var(--gold),#ff9f43);color:#2a1800}
.btn-mint{background:var(--mint);color:#0a2018}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-row{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap}
.btn-row .btn{width:auto;flex:1;min-width:90px;padding:.55rem;font-size:.8rem}
input,textarea,select{width:100%;background:#120a14;border:1px solid var(--line);border-radius:10px;padding:.65rem;color:var(--ink);font-size:16px;margin:.25rem 0 .45rem}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#120a14;border-top:1px solid var(--line);padding:.25rem;z-index:20}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-size:.6rem;padding:.35rem .1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.12rem;position:relative}
.nav button.on{color:var(--gold)}
.badge-n{position:absolute;top:0;right:12%;min-width:16px;height:16px;border-radius:999px;background:var(--pink);color:#fff;font-size:.65rem;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.badge-n.show{display:flex}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2a1830;padding:.5rem 1rem;border-radius:999px;opacity:0;transition:.25s;z-index:40;font-size:.85rem;border:1px solid var(--line);max-width:90%;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
.sub{color:var(--muted);font-size:.8rem}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#2a1520}
.row{display:flex;gap:.6rem;align-items:flex-start}
.badge{font-size:.68rem;padding:.1rem .4rem;border-radius:999px;background:rgba(255,200,90,.15);color:var(--gold)}
.price{color:var(--gold);font-weight:700}
.live{display:flex;align-items:center;gap:.35rem;color:var(--mint);font-size:.75rem}
.wrap{padding:1rem}
.photo-btn{display:block;border:1px dashed var(--line);border-radius:10px;padding:.8rem;text-align:center;color:var(--muted);cursor:pointer}
.preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin:.35rem 0}
</style>
</head>
<body>
<div class="top">
  <div><strong id="who">Gestión</strong><div class="sub">La Tati</div></div>
  <div class="live" id="livePill"><span id="liveIco"></span> <span>en vivo</span></div>
</div>
<div class="wrap">
  <section id="view-login">
    <div class="panel">
      <h2 style="margin-bottom:.5rem">Acceso gestora</h2>
      <input id="pin" type="password" placeholder="PIN" autocomplete="current-password"/>
      <button type="button" class="btn btn-gold" id="btnLogin">Entrar</button>
    </div>
  </section>
  <section id="view-prods" class="hidden">
    <button type="button" class="btn btn-gold" id="btnNew" style="margin-bottom:.7rem">Nuevo producto</button>
    <div id="list"></div>
  </section>
  <section id="view-edit" class="hidden">
    <div class="panel">
      <h2 id="editTitle">Producto</h2>
      <input type="hidden" id="fId"/>
      <label class="sub">Título</label><input id="fTitle"/>
      <label class="sub">Categoría</label>
      <select id="fCat">
        <option value="General">General</option>
        <option value="Ropa">Ropa</option>
        <option value="Calzado">Calzado</option>
        <option value="Accesorios">Accesorios</option>
        <option value="Belleza">Belleza</option>
        <option value="Hogar">Hogar</option>
        <option value="__new__">Otra (escribir…)</option>
      </select>
      <input id="fCatNew" class="hidden" placeholder="Nueva categoría"/>
      <label class="sub">Entrega</label>
      <select id="fDelivery">
        <option value="both">Recogida o domicilio</option>
        <option value="pickup">Solo recogida</option>
        <option value="delivery">Solo domicilio</option>
      </select>
      <label class="sub">Descripción</label><textarea id="fDesc" rows="2"></textarea>
      <label class="sub">Precio (vacío = por confirmar)</label><input id="fPrice" type="number" step="0.01" inputmode="decimal"/>
      <label class="sub">Moneda</label>
      <select id="fCur"><option>CUP</option><option>USD</option><option>EUR</option><option>Zelle</option></select>
      <label class="sub">Cantidad (opcional, el negocio casi nunca la informa)</label><input id="fStock" type="number" placeholder="Dejar vacío = sin control de stock"/>
      <label class="photo-btn" id="photoLabel">Elegir foto<input type="file" id="fPhoto" accept="image/*" hidden/></label>
      <img id="fPreview" class="preview hidden" alt=""/>
      <div class="btn-row">
        <button type="button" class="btn btn-gold" id="btnSave">Guardar</button>
        <button type="button" class="btn btn-ghost" id="btnCancelEdit">Volver</button>
      </div>
    </div>
  </section>
  <section id="view-orders" class="hidden">
    <h2 style="margin-bottom:.35rem">Pedidos</h2>
    <p class="sub" style="margin-bottom:.6rem">Confirma tras validar con el negocio. Puedes borrar cancelados.</p>
    <div id="orders"></div>
  </section>
  <section id="view-interest" class="hidden">
    <h2 style="margin-bottom:.35rem">Intereses de precio</h2>
    <p class="sub" style="margin-bottom:.6rem">Clientes que quieren saber el precio de un producto.</p>
    <div id="interests"></div>
  </section>
  <section id="view-chat" class="hidden">
    <div id="threads"></div>
    <div id="threadView" class="hidden">
      <button type="button" class="btn btn-ghost" id="btnBackTh" style="width:auto;margin-bottom:.5rem">Volver</button>
      <div class="sub" id="thLabel" style="margin-bottom:.4rem"></div>
      <div id="thMsgs" class="panel" style="max-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:.35rem"></div>
      <div style="display:flex;gap:.4rem;margin-top:.5rem">
        <input id="thIn" placeholder="Responder…" style="margin:0;flex:1"/>
        <button type="button" class="btn btn-gold" id="btnThSend" style="width:auto;padding:.65rem .9rem">Enviar</button>
      </div>
    </div>
  </section>
  <section id="view-cfg" class="hidden">
    <div class="panel">
      <h2>Perfil público</h2>
      <label class="sub">Nombre</label><input id="cfgName"/>
      <label class="sub">WhatsApp</label><input id="cfgWa"/>
      <label class="sub">Dirección de recogida</label><input id="cfgAddr"/>
      <label class="sub">Bio / eslogan</label><textarea id="cfgBio" rows="2"></textarea>
      <label class="sub">Eslogan corto (tagline)</label><input id="cfgTagline" placeholder="Tu pedido · tu vale"/>
      <label class="sub">Color principal</label><input id="cfgAccent" type="color" value="#e8b4c8" style="height:42px;padding:0.2rem"/>
      <label class="sub">Color secundario</label><input id="cfgAccent2" type="color" value="#c4789a" style="height:42px;padding:0.2rem"/>
      <label class="sub">PIN nuevo (opcional)</label><input id="cfgPin" type="password"/>
      <button type="button" class="btn btn-gold" id="btnCfgSave">Guardar</button>
    </div>
  </section>
</div>
<nav class="nav hidden" id="nav">
  <button type="button" data-v="prods"><span id="iProds"></span>Productos</button>
  <button type="button" data-v="orders"><span id="iOrders"></span>Pedidos<span class="badge-n" id="badgeOrders">0</span></button>
  <button type="button" data-v="interest"><span id="iInt"></span>Interés<span class="badge-n" id="badgeInt">0</span></button>
  <button type="button" data-v="chat"><span id="iChat"></span>Chat<span class="badge-n" id="badgeChat">0</span></button>
  <button type="button" data-v="cfg"><span id="iCfg"></span>Perfil</button>
</nav>
<div class="toast" id="toast"></div>
<script>

  function ico(name){
    var s={
      bag:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>',
      list:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
      chat:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>',
      gear:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      star:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.5 6.5L21 10l-5 4.2L17.5 21 12 17.5 6.5 21 8 14.2 3 10l6.5-.5z"/></svg>',
      live:'<svg viewBox="0 0 24 24" width="10" height="10"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>',
      trash:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M8 7l1 12h6l1-12"/></svg>'
    };
    return s[name]||'';
  }

(function(){
  function detectTenant(){
    var q=new URLSearchParams(location.search).get('t');
    if(q)return String(q).toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/^gestion-/,'')||'latati';
    var p=location.pathname||'';
    var m=p.match(/\/w\/(gestion-)?([a-z0-9-]+)\.app\.ans/i);
    if(!m)return 'latati';
    var s=(m[2]||'latati').toLowerCase();
    if(s==='gestion-latati')return 'latati';
    return s||'latati';
  }
  var TENANT=detectTenant();
  var API=TENANT==='latati'?'/api/latati':'/api/latati/t/'+TENANT;
  function applyTheme(prof){
    if(!prof)return;
    var r=document.documentElement;
    if(prof.accent)r.style.setProperty('--accent',prof.accent);
    if(prof.accent2)r.style.setProperty('--accent2',prof.accent2);
    if(prof.bg)r.style.setProperty('--bg',prof.bg);
    if(prof.surface)r.style.setProperty('--surface',prof.surface);
    if(prof.tagline&&document.getElementById('brandSub'))document.getElementById('brandSub').textContent=prof.tagline;
    if(prof.name){
      document.title=prof.name+(document.title.indexOf('Gestión')>=0?' · Gestión':'');
      if(document.getElementById('brandName'))document.getElementById('brandName').textContent=prof.name;
    }
  }
  var TK='latati_gestor_tok_'+TENANT;
  var token=localStorage.getItem(TK)||'';
  var activeTh='', editingPhoto=null;
  var pendingOrders=0, pendingInt=0, pendingChat=0;
  function $(id){return document.getElementById(id)}
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2600)}
  function H(j){var h={};if(j)h['Content-Type']='application/json';if(token)h['X-LaTati-Token']=token;return h}
  function esc(s){return String(s||'').replace(/</g,'&lt;')}
  function hide(){['login','prods','edit','orders','interest','chat','cfg'].forEach(function(v){$('view-'+v).classList.add('hidden')})}
  function show(v){
    hide();$('view-'+v).classList.remove('hidden');
    if(v==='login') $('nav').classList.add('hidden'); else $('nav').classList.remove('hidden');
    document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
  }
  function authed(){return !!token}
  function setBadge(el,n){if(!el)return;el.textContent=String(n);el.classList.toggle('show',n>0)}
  function photo(p){return p&&p.photo?(API+'/photo/'+p.id+'?t='+(p.updated_at||'')):''}

  async function login(){
    var d=await(await fetch(API+'/gestor/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})})).json();
    if(!d.ok){toast('PIN incorrecto');return}
    token=d.token;localStorage.setItem(TK,token);
    if(d.profile)applyTheme(d.profile);
    $('who').textContent=(d.profile&&d.profile.name)||'Gestora';
    show('prods');loadProds();loadOrders();loadInterests();
  }
  $('btnLogin').onclick=login;

  async function loadProds(){
    var d=await(await fetch(API+'/gestor/products',{headers:H()})).json();
    if(!d.ok){token='';localStorage.removeItem(TK);show('login');return}
    var el=$('list'), list=d.items||[];
    if(!list.length){el.innerHTML='<div class="sub" style="padding:1rem;text-align:center">Sin productos</div>';return}
    el.innerHTML=list.map(function(p){
      var img=photo(p);
      var st=p.sold_out?'AGOTADO':((p.price_pending||!(p.price>0))?'Sin precio':(p.currency+' '+Number(p.price).toFixed(2)));
      return '<div class="panel" data-id="'+p.id+'"><div class="row">'+(img?'<img class="thumb" src="'+img+'" alt="">':'')+
        '<div style="flex:1"><strong>'+esc(p.title)+'</strong><div class="sub">'+esc(p.category||'General')+'</div><div class="price">'+esc(st)+'</div>'+
        '<div class="sub">'+(p.sold_out?'Fuera del catálogo cliente':'Sin control de stock')+'</div>'+
        '<div class="btn-row"><button type="button" class="btn btn-ghost be">Editar</button>'+
        (p.sold_out?'<button type="button" class="btn btn-mint br">Reactivar</button>':'<button type="button" class="btn btn-ghost ba">Agotado</button>')+
        '<button type="button" class="btn btn-ghost bd">Borrar</button></div></div></div></div>';
    }).join('');
    el.querySelectorAll('.be').forEach(function(b){b.onclick=function(){openEdit(b.closest('.panel').getAttribute('data-id'), list)}});
    el.querySelectorAll('.ba').forEach(function(b){b.onclick=async function(){
      var id=b.closest('.panel').getAttribute('data-id');
      await fetch(API+'/gestor/products/'+id+'/soldout',{method:'POST',headers:H(1),body:'{}'});
      toast('Marcado agotado · se elimina del catálogo a las 24 h');loadProds();
    }});
    el.querySelectorAll('.br').forEach(function(b){b.onclick=async function(){
      var id=b.closest('.panel').getAttribute('data-id');
      await fetch(API+'/gestor/products/'+id+'/restore',{method:'POST',headers:H(1),body:'{}'});
      toast('Producto reactivado');loadProds();
    }});
    el.querySelectorAll('.bd').forEach(function(b){b.onclick=async function(){
      if(!confirm('¿Eliminar producto?'))return;
      var id=b.closest('.panel').getAttribute('data-id');
      await fetch(API+'/gestor/products/'+id+'/delete',{method:'POST',headers:H(1),body:'{}'});
      loadProds();
    }});
  }

  function openEdit(id, list){
    var p=(list||[]).find(function(x){return x.id===id})||{};
    $('fId').value=p.id||'';$('fTitle').value=p.title||'';$('fDesc').value=p.description||'';
    var cat=p.category||'General';
    var known=['General','Ropa','Calzado','Accesorios','Belleza','Hogar'];
    if(known.indexOf(cat)>=0){$('fCat').value=cat;$('fCatNew').classList.add('hidden');$('fCatNew').value=''}
    else{$('fCat').value='__new__';$('fCatNew').classList.remove('hidden');$('fCatNew').value=cat}
    $('fDelivery').value=(p.delivery_mode==='pickup'||p.delivery_mode==='delivery')?p.delivery_mode:'both';
    $('fPrice').value=(p.price_pending||!(p.price>0))?'':p.price;
    $('fCur').value=p.currency||'CUP';$('fStock').value='';
    editingPhoto=null;$('fPreview').classList.add('hidden');
    if(p.photo){$('fPreview').src=photo(p);$('fPreview').classList.remove('hidden')}
    $('editTitle').textContent=p.id?'Editar':'Nuevo producto';
    show('edit');
  }
  $('btnNew').onclick=function(){openEdit('',[])};
  if($('fCat'))$('fCat').onchange=function(){
    if($('fCat').value==='__new__')$('fCatNew').classList.remove('hidden');
    else{$('fCatNew').classList.add('hidden');$('fCatNew').value=''}
  };
  $('btnCancelEdit').onclick=function(){show('prods');loadProds()};
  $('fPhoto').onchange=function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    editingPhoto=f;var r=new FileReader();r.onload=function(){$('fPreview').src=r.result;$('fPreview').classList.remove('hidden')};r.readAsDataURL(f);
  };
  $('btnSave').onclick=async function(){
    var priceVal=$('fPrice').value.trim();
    var catVal=$('fCat').value;
    if(catVal==='__new__'){catVal=($('fCatNew').value.trim()||'General')}
    var body={id:$('fId').value||undefined,title:$('fTitle').value.trim(),category:catVal,delivery_mode:$('fDelivery').value,description:$('fDesc').value.trim(),
      currency:$('fCur').value,price:priceVal===''?0:Number(priceVal),price_pending:priceVal===''};
    if(!body.title){toast('Título requerido');return}
    var d=await(await fetch(API+'/gestor/products',{method:'POST',headers:H(1),body:JSON.stringify(body)})).json();
    if(!d.ok){toast(d.error||'Error');return}
    var id=d.item&&d.item.id;
    if(editingPhoto&&id){
      var fd=new FormData();fd.append('photo',editingPhoto);
      await fetch(API+'/gestor/products/'+id+'/photo',{method:'POST',headers:{'X-LaTati-Token':token},body:fd});
    }
    toast('Guardado');show('prods');loadProds();
  };

  function stLabel(s){
    return ({requested:'Por confirmar',pending:'Confirmado',ready:'Listo',delivered:'Entregado',cancelled:'Cancelado'})[s]||s||'—';
  }
  async function loadOrders(){
    var d=await(await fetch(API+'/orders',{headers:H()})).json();
    if(!d.ok)return;
    pendingOrders=d.pending_count||0;
    setBadge($('badgeOrders'), pendingOrders);
    if(typeof d.interest_count==='number'){pendingInt=d.interest_count;setBadge($('badgeInt'),pendingInt)}
    var list=d.items||[],el=$('orders');
    if(!$('view-orders').classList.contains('hidden')){
      // marcar visto al estar en la vista
      fetch(API+'/gestor/orders-seen',{method:'POST',headers:H(1),body:'{}'}).catch(function(){});
      setBadge($('badgeOrders'),0);pendingOrders=0;
    }
    if(!list.length){el.innerHTML='<div class="sub" style="text-align:center;padding:1rem">Sin pedidos</div>';return}
    list=list.slice().sort(function(a,b){
      var wa=a.status==='requested'?0:1,wb=b.status==='requested'?0:1;
      if(wa!==wb)return wa-wb;return (b.ts||'').localeCompare(a.ts||'');
    });
    el.innerHTML=list.map(function(o){
      var st=(o.status||'').toLowerCase(),actions='';
      if(st==='requested'){
        actions='<div class="btn-row"><button type="button" class="btn btn-gold st" data-id="'+esc(o.code)+'" data-s="confirm">Confirmar</button>'+
          '<button type="button" class="btn btn-ghost st" data-id="'+esc(o.code)+'" data-s="cancelled">Cancelar</button></div>'+
          '<p class="sub" style="margin-top:.35rem">Valida con el negocio antes de confirmar.</p>';
      } else if(st==='pending'||st==='ready'){
        actions='<div class="btn-row"><button type="button" class="btn btn-ghost st" data-id="'+esc(o.code)+'" data-s="ready">Listo</button>'+
          '<button type="button" class="btn btn-ghost st" data-id="'+esc(o.code)+'" data-s="delivered">Entregado</button>'+
          '<button type="button" class="btn btn-ghost st" data-id="'+esc(o.code)+'" data-s="cancelled">Cancelar</button></div>';
      } else if(st==='cancelled'||st==='delivered'){
        actions='<div class="btn-row"><button type="button" class="btn btn-ghost del" data-id="'+esc(o.id||o.code)+'">Eliminar de la lista</button></div>';
      }
      return '<div class="panel"><strong>'+esc(o.code)+'</strong> <span class="badge">'+esc(stLabel(st))+'</span>'+
        '<div class="sub">'+esc(o.client_name)+' · '+esc(o.client_phone)+'</div>'+
        '<div class="sub">'+(o.delivery_type==='delivery'?('Domicilio: '+esc(o.delivery_address||'—')):('Recogida'+(o.address?' · '+esc(o.address):'')))+'</div>'+
        '<div class="price">'+(o.currency||'')+' '+Number(o.total).toFixed(2)+'</div>'+
        '<div class="sub">'+(o.lines||[]).map(function(l){return l.qty+'× '+l.title}).join(', ')+'</div>'+actions+'</div>';
    }).join('');
    el.querySelectorAll('.st').forEach(function(b){b.onclick=async function(){
      var s=b.getAttribute('data-s');
      var d=await(await fetch(API+'/order/'+encodeURIComponent(b.getAttribute('data-id'))+'/status',{method:'POST',headers:H(1),body:JSON.stringify({status:s})})).json();
      if(!d.ok){toast(d.error||'Error');return}
      toast(s==='confirm'||s==='pending'?'Confirmado · vale emitido':(s==='cancelled'?'Cancelado':'Actualizado'));
      loadOrders();loadProds();
    }});
    el.querySelectorAll('.del').forEach(function(b){b.onclick=async function(){
      var d=await(await fetch(API+'/order/'+encodeURIComponent(b.getAttribute('data-id'))+'/delete',{method:'POST',headers:H(1),body:'{}'})).json();
      if(!d.ok){toast(d.error||'Error');return}
      toast('Eliminado');loadOrders();
    }});
  }

  async function loadInterests(){
    var d=await(await fetch(API+'/gestor/interests',{headers:H()})).json();
    if(!d.ok)return;
    var list=d.items||[];
    pendingInt=list.filter(function(x){return !x.seen}).length;
    setBadge($('badgeInt'), pendingInt);
    var el=$('interests');
    if(!list.length){el.innerHTML='<div class="sub" style="text-align:center;padding:1rem">Sin intereses aún</div>';return}
    var hasRead=list.some(function(x){return x.seen});
    el.innerHTML=(hasRead?'<button type="button" class="btn btn-ghost" id="btnClearRead" style="margin-bottom:.6rem">Eliminar intereses leídos</button>':'')+list.map(function(it){
      return '<div class="panel"><strong>'+esc(it.title||it.product_id)+'</strong>'+(it.seen?'':' <span class="badge">nuevo</span>')+
        '<div class="sub">'+esc(it.client_name)+' · '+esc(it.client_phone)+'</div>'+
        '<div class="sub">'+esc(it.ts||'')+'</div>'+
        '<div class="btn-row">'+(it.seen?'':'<button type="button" class="btn btn-ghost mk" data-id="'+it.id+'">Marcar visto</button>')+
        (it.seen?'<button type="button" class="btn btn-ghost deli" data-id="'+it.id+'">Eliminar</button>':'')+
        '<button type="button" class="btn btn-gold go" data-pid="'+it.product_id+'">Ir al producto</button></div></div>';
    }).join('');
    var clr=$('btnClearRead');
    if(clr)clr.onclick=async function(){
      await fetch(API+'/gestor/interests',{method:'POST',headers:H(1),body:JSON.stringify({clear_read:true})});
      toast('Intereses leídos eliminados');loadInterests();
    };
    el.querySelectorAll('.mk').forEach(function(b){b.onclick=async function(){
      await fetch(API+'/gestor/interests',{method:'POST',headers:H(1),body:JSON.stringify({id:b.getAttribute('data-id'),seen:true})});
      loadInterests();
    }});
    el.querySelectorAll('.deli').forEach(function(b){b.onclick=async function(){
      await fetch(API+'/gestor/interests',{method:'POST',headers:H(1),body:JSON.stringify({id:b.getAttribute('data-id'),delete:true})});
      toast('Eliminado');loadInterests();
    }});
    el.querySelectorAll('.go').forEach(function(b){b.onclick=function(){show('prods');loadProds()}});
  }

  var activeTh='';
  function inChatView(){return !$('view-chat').classList.contains('hidden')}
  function inThreadView(){return inChatView()&&!!$('threadView')&&!$('threadView').classList.contains('hidden')&&!!activeTh}
  function notifyChat(msg){
    pendingChat=(pendingChat||0)+1;
    setBadge($('badgeChat'), pendingChat);
    if(msg)toast(msg);
  }
  async function loadThreads(){
    // Lista de conversaciones: nunca forzar un hilo abierto
    activeTh='';
    $('threadView').classList.add('hidden');$('threads').classList.remove('hidden');
    var d=await(await fetch(API+'/threads',{headers:H()})).json();
    var el=$('threads');
    if(!d.items||!d.items.length){el.innerHTML='<div class="sub" style="text-align:center;padding:1rem">Sin chats</div>';return}
    el.innerHTML=d.items.map(function(t){
      return '<div class="panel" data-th="'+esc(t.thread)+'" style="cursor:pointer"><strong>'+esc(t.name||t.thread)+'</strong><div class="sub">'+esc(t.last)+'</div></div>';
    }).join('');
    el.querySelectorAll('.panel').forEach(function(p){p.onclick=function(){
      // Entrada explícita a un chat concreto
      openTh(p.getAttribute('data-th'));
    }});
  }
  async function openTh(th){
    if(!th)return;
    activeTh=th;
    $('threads').classList.add('hidden');
    $('threadView').classList.remove('hidden');
    $('thLabel').textContent=th;
    // Al entrar a un hilo, limpia badge de chat
    pendingChat=0;setBadge($('badgeChat'),0);
    var d=await(await fetch(API+'/chat?thread='+encodeURIComponent(th),{headers:H()})).json();
    var box=$('thMsgs');
    box.innerHTML=(d.items||d.messages||[]).map(function(m){
      return '<div style="align-self:'+(m.from==='gestor'?'flex-end':'flex-start')+';background:'+(m.from==='gestor'?'#3a2a20':'#241828')+';padding:.45rem .65rem;border-radius:12px;max-width:85%">'+esc(m.text)+'</div>';
    }).join('');
    box.scrollTop=box.scrollHeight;
  }
  // Volver a la lista: queda en la lista (no reabre el último chat)
  $('btnBackTh').onclick=function(){
    activeTh='';
    loadThreads();
  };
  $('btnThSend').onclick=async function(){
    var t=$('thIn').value.trim();if(!t||!activeTh)return;$('thIn').value='';
    await fetch(API+'/chat',{method:'POST',headers:H(1),body:JSON.stringify({thread:activeTh,from:'gestor',text:t})});
    openTh(activeTh);
  };

  async function loadCfg(){
    var d=await(await fetch(API+'/profile')).json();
    var p=d.profile||{};
    $('cfgName').value=p.name||'';$('cfgWa').value=p.whatsapp||'';$('cfgAddr').value=p.address||'';$('cfgBio').value=p.bio||'';
    if($('cfgTagline'))$('cfgTagline').value=p.tagline||'';
    if($('cfgAccent')&&p.accent)$('cfgAccent').value=p.accent;
    if($('cfgAccent2')&&p.accent2)$('cfgAccent2').value=p.accent2;
  }
  $('btnCfgSave').onclick=async function(){
    var body={name:$('cfgName').value.trim(),whatsapp:$('cfgWa').value.trim(),address:$('cfgAddr').value.trim(),bio:$('cfgBio').value.trim(),tagline:($('cfgTagline')&&$('cfgTagline').value.trim())||'',accent:($('cfgAccent')&&$('cfgAccent').value)||'',accent2:($('cfgAccent2')&&$('cfgAccent2').value)||''};
    if($('cfgPin').value.trim())body.pin=$('cfgPin').value.trim();
    var d=await(await fetch(API+'/gestor/profile',{method:'POST',headers:H(1),body:JSON.stringify(body)})).json();
    if(!d.ok){toast(d.error||'Error');return}
    toast('Perfil guardado');$('who').textContent=body.name||'Gestora';
  };

  document.querySelectorAll('.nav button').forEach(function(b){
    b.onclick=function(){
      if(!authed()){show('login');return}
      var v=b.getAttribute('data-v');show(v);
      if(v==='prods')loadProds();
      if(v==='orders')loadOrders();
      if(v==='interest')loadInterests();
      if(v==='chat'){activeTh='';loadThreads();}
      if(v==='cfg')loadCfg();
    };
  });

  function sameTenant(ev){
    try{
      var d=ev&&ev.data?JSON.parse(ev.data):{};
      if(!d||d.tenant==null||d.tenant==='')return true;
      return String(d.tenant)===String(TENANT);
    }catch(e){return true}
  }
  function onOrderEvent(ev){
    if(!token)return;
    if(!sameTenant(ev))return;
    try{var d=ev&&ev.data?JSON.parse(ev.data):{};toast(d.code?('Pedido '+d.code):'Nuevo movimiento de pedido')}catch(e){toast('Nuevo movimiento de pedido')}
    loadOrders();
    // No tocar la vista de chat: el usuario decide dónde está
  }
  function onInterestEvent(ev){
    if(!token)return;
    if(ev&&!sameTenant(ev))return;
    toast('Nuevo interés de precio');
    loadInterests();
  }
  function bindLive(){
    if(typeof EventSource==='undefined')return;
    try{
      function onCat(ev){if(!token||!sameTenant(ev))return;loadProds()}
      function handleChatEvent(ev){
        if(!token||!sameTenant(ev))return;
        var thr='';
        try{var d=ev&&ev.data?JSON.parse(ev.data):{};thr=d.thread||''}catch(e){}
        // Solo refrescar mensajes si YA estamos dentro de ESE hilo
        if(inThreadView()&&activeTh&&(!thr||thr===activeTh)){
          openTh(activeTh);
          return;
        }
        // En lista de chats: actualizar lista, no abrir ningún hilo
        if(inChatView()&&!inThreadView()){
          loadThreads();
          notifyChat('Nuevo mensaje en chat');
          return;
        }
        // En otra vista: solo avisar (badge + toast)
        notifyChat('Nuevo mensaje en chat');
      }
      var es=new EventSource(API+'/events');
      es.addEventListener('latati_hello',function(){if(token){loadProds();loadOrders();loadInterests()}});
      es.addEventListener('latati_catalog',onCat);
      es.addEventListener('latati_order',onOrderEvent);
      es.addEventListener('latati_interest',onInterestEvent);
      es.addEventListener('latati_chat',handleChatEvent);
      var es2=new EventSource('/api/pulse');
      es2.addEventListener('latati_order',onOrderEvent);
      es2.addEventListener('latati_interest',onInterestEvent);
      es2.addEventListener('latati_catalog',onCat);
      es2.addEventListener('latati_chat',handleChatEvent);
    }catch(e){}
  }
  $('liveIco').innerHTML=ico('live');
  $('iProds').innerHTML=ico('bag');$('iOrders').innerHTML=ico('list');$('iInt').innerHTML=ico('star');$('iChat').innerHTML=ico('chat');$('iCfg').innerHTML=ico('gear');
  bindLive();
  if(token){show('prods');loadProds();loadOrders();loadInterests()}
  else show('login');
  setInterval(function(){
    if(!token)return;
    if(!$('view-prods').classList.contains('hidden'))loadProds();
    loadOrders();
    loadInterests();
    // Chat: solo refrescar el hilo si el usuario está DENTRO de él.
    // Si está en la lista, solo actualizar la lista (sin reabrir chats).
    if(inThreadView())openTh(activeTh);
    else if(inChatView())loadThreads();
  },5000);
})();
</script>
</body>
</html>
